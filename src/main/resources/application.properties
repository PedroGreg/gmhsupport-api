# ---------------------------------------------------------------------
# Banco de dados
# No Render: DB_URL, DB_USER e DB_PASSWORD apontam para o PostgreSQL do Neon.
# Sem essas variáveis (rodando no seu computador), usa um H2 em memória
# no modo PostgreSQL, com as mesmas migrations.
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:helpdesk;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
# O plano gratuito do Neon aceita poucas conexões: 5 é suficiente para a API
spring.datasource.hikari.maximum-pool-size=5
# O Neon roda em UTC: as datas automáticas do banco (data de abertura etc.) ficam no horário de Brasília
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'America/Sao_Paulo'

spring.h2.console.enabled=true

# Quem cria e altera as tabelas é o Flyway (db/migration). O Hibernate não mexe no banco.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
server.port=8080
server.address=0.0.0.0
# No Render a API fica atrás de um proxy HTTPS: isso faz o Swagger usar https:// nas chamadas
server.forward-headers-strategy=framework

# ---------------------------------------------------------------------
# Preço do atendimento
# valor = valor base da subcategoria x (1 + acréscimo da prioridade)
#       + deslocamento (km acima dos gratuitos x preço por km)
# Distância em linha reta a partir do SENAC Jurubatuba
# (Av. Eng. Eusébio Stevaux, 823 - Santo Amaro, São Paulo - SP)
# ---------------------------------------------------------------------
gmh.origem.latitude=-23.674469
gmh.origem.longitude=-46.697599
gmh.km.preco=1.50
gmh.km.gratis=5
gmh.km.maximo=40

# ----- Etapa 2 -----
# Upload da certidão de antecedentes (o arquivo pode ter até 5 MB; o pedido inteiro um pouco mais)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Primeiro administrador (defina no Render; nunca coloque a senha aqui)
gmh.admin.email=${ADMIN_EMAIL:}
gmh.admin.senha=${ADMIN_PASSWORD:}
gmh.admin.nome=${ADMIN_NOME:Administrador}
# true = apaga o Authenticator do admin ao iniciar (celular perdido). Use uma vez e volte para false
gmh.admin.reset-2fa=${ADMIN_RESET_2FA:false}
# Parte do valor pago que vai para o técnico (o resto fica com a plataforma)
gmh.repasse.percentual=0.80
# Segredo dos tokens: defina API_SECURITY_TOKEN_SECRET no Render (texto longo e aleatório)
api.security.token.secret=${API_SECURITY_TOKEN_SECRET:Aoba1223}

# ----- Etapa 3: Mercado Pago -----
# Access Token (TEST- ou APP_USR-): SÓ no Render, nunca no código nem no app
gmh.mp.access-token=${MP_ACCESS_TOKEN:}
# Assinatura secreta dos webhooks (painel do Mercado Pago > Webhooks)
gmh.mp.webhook-secret=${MP_WEBHOOK_SECRET:}
# Endereço público da API (o Mercado Pago chama o webhook e devolve o cliente aqui)
gmh.api.url-publica=${API_URL_PUBLICA:https://gmhsupport-api.onrender.com}
gmh.mp.pix-minutos=60
gmh.mp.parcelas-maximo=6
# Só para TESTES: "Já paguei" aprova um Pix pendente (o Pix de teste do Mercado Pago não tem como ser pago)
gmh.pagamento.simular=${PAGAMENTO_SIMULADO:false}
# Só para TESTES: e-mail de um usuário de teste do Mercado Pago para usar como pagador
gmh.mp.email-pagador-teste=${MP_EMAIL_PAGADOR_TESTE:}
